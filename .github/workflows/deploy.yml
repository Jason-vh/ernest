name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ernest-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_DIR: /home/exedev/apps/ernest

jobs:
  deploy:
    name: Deploy to exe.dev VM
    runs-on: [self-hosted, linux, ernest-prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy checkout to stable deploy directory
        run: |
          rm -rf "$DEPLOY_DIR.tmp"
          mkdir -p "$DEPLOY_DIR.tmp"
          cp -a . "$DEPLOY_DIR.tmp/"
          rm -rf "$DEPLOY_DIR"
          mv "$DEPLOY_DIR.tmp" "$DEPLOY_DIR"

      - name: Deploy with Docker Compose
        run: |
          cd "$DEPLOY_DIR"
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Reload Caddy
        run: |
          sudo /usr/bin/caddy validate --config /etc/caddy/Caddyfile
          sudo /usr/bin/systemctl reload caddy
